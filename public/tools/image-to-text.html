<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Text Converter - IMAGE 24</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
    }

    .upload-box input {
      display: none;
    }

    .upload-button {
      display: inline-block;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 450px;
      margin: 25px auto;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .result-box {
      display: none;
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-top: 20px;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      padding: 15px;
      font-size: 16px;
      line-height: 1.6;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #copyBtn {
      background: #16a34a;
      color: white;
    }

    #clearBtn {
      background: #e5e7eb;
      color: #111827;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Image to Text Converter</h1>

    <div class="subtitle">
      Hindi + English text निकालें और आसानी से Copy करें
    </div>

    <label class="upload-box">
      <span class="upload-button">📷 Upload Image</span>
      <input type="file" id="imageInput" accept="image/*">
      <p>JPG, PNG, WEBP आदि image upload करें</p>
    </label>

    <img id="preview" alt="Uploaded image">

    <div id="status"></div>

    <div class="result-box" id="resultBox">
      <h3>📝 Extracted Text</h3>

      <textarea id="textOutput"
        placeholder="Image से निकला हुआ text यहाँ दिखाई देगा..."></textarea>

      <div class="buttons">
        <button id="copyBtn">📋 Copy Text</button>
        <button id="clearBtn">🗑️ Clear</button>
      </div>
    </div>

  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const resultBox = document.getElementById("resultBox");
    const textOutput = document.getElementById("textOutput");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");

    imageInput.addEventListener("change", async function () {
      const file = this.files[0];

      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";

      resultBox.style.display = "block";
      textOutput.value = "";
      status.textContent = "⏳ Image पढ़ी जा रही है...";

      try {
        const worker = await Tesseract.createWorker("eng+hin");

        const result = await worker.recognize(file);

        textOutput.value = result.data.text.trim();

        await worker.terminate();

        if (textOutput.value) {
          status.textContent = "✅ Text successfully extracted!";
        } else {
          status.textContent = "⚠️ Image में readable text नहीं मिला।";
        }

      } catch (error) {
        console.error(error);
        status.textContent =
          "❌ Text निकालने में समस्या हुई। कृपया दूसरी image try करें।";
      }
    });

    copyBtn.addEventListener("click", async function () {
      if (!textOutput.value.trim()) return;

      try {
        await navigator.clipboard.writeText(textOutput.value);
        copyBtn.textContent = "✅ Copied!";
        
        setTimeout(() => {
          copyBtn.textContent = "📋 Copy Text";
        }, 1500);

      } catch (error) {
        textOutput.select();
        document.execCommand("copy");
        copyBtn.textContent = "✅ Copied!";

        setTimeout(() => {
          copyBtn.textContent = "📋 Copy Text";
        }, 1500);
      }
    });

    clearBtn.addEventListener("click", function () {
      imageInput.value = "";
      preview.src = "";
      preview.style.display = "none";
      textOutput.value = "";
      resultBox.style.display = "none";
      status.textContent = "";
    });
  </script>

</body>
</html>
